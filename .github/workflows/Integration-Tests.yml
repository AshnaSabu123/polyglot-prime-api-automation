name: Nexus Ingestion API - Integration Tests

on:
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nexus-ingestion-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug structure (recommended once)
        run: |
          pwd
          ls -R

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
          cache: maven

      - name: Run Integration Tests
        run: |
          mvn clean verify site \
            -DskipUTs=true \
            -DgenerateReports=false

      - name: Upload Failsafe Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ingestion-api-failsafe-report
          path: nexus-ingestion-api/target/site/
          if-no-files-found: warn

      - name: Publish Test Summary
        if: always()
        run: |
          REPORT_DIR="nexus-ingestion-api/target/failsafe-reports"

          if [ -d "$REPORT_DIR" ]; then
          TOTAL=$(grep -h "<testsuite" $REPORT_DIR/*.xml | grep -o 'tests="[0-9]*"' | cut -d'"' -f2 | awk '{s+=$1} END {print s}')
          FAILURES=$(grep -h "<testsuite" $REPORT_DIR/*.xml | grep -o 'failures="[0-9]*"' | cut -d'"' -f2 | awk '{s+=$1} END {print s}')
          ERRORS=$(grep -h "<testsuite" $REPORT_DIR/*.xml | grep -o 'errors="[0-9]*"' | cut -d'"' -f2 | awk '{s+=$1} END {print s}')

           echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
           echo "- Total: $TOTAL" >> $GITHUB_STEP_SUMMARY
           echo "- Failures: $FAILURES" >> $GITHUB_STEP_SUMMARY
           echo "- Errors: $ERRORS" >> $GITHUB_STEP_SUMMARY
           else
           echo "No failsafe reports found" >> $GITHUB_STEP_SUMMARY
           fi
